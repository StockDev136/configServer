spring.application.name=ApiGateway

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}

spring.cloud.gateway.server.webmvc.routes[0].id=productModule
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://product
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/product/**

spring.cloud.gateway.server.webmvc.routes[1].id=stockModule
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://stock
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/stock/**

management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0

server.port=8080
