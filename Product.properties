spring.application.name=product
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}

management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0

resilience4j.circuitbreaker.instances.demoCircuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.demoCircuitBreaker.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.demoCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.demoCircuitBreaker.wait-duration-in-open-state=5s

server.port=8901
